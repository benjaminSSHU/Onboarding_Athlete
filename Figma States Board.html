  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

px; top:0; width:390px; height:860px; border:0;\"><\u002Fiframe>\n<script>\nconst board = document.getElementById('board');\nconst statusEl = document.getElementById('status');\nconst wait = ms => new Promise(r => setTimeout(r, ms));\nconst doc = () => document.getElementById('src').contentDocument;\nconst $$ = sel => [...doc().querySelectorAll(sel)];\nconst sheet = () => $$('div').find(d => (d.style.borderRadius||'').replace(/\\s/g,'').startsWith('24px'));\nfunction chipPlus(){ return $$('button').find(b => b.textContent.trim().startsWith('+') && b.style.cursor!=='not-allowed'); }\nfunction cta(){ return $$('button').find(b => ['Continuer','Voir ma routine'].includes(b.textContent.trim())); }\nasync function fillRest(max){ for(let g=0; g<(max||6); g++){ const c=chipPlus(); if(!c) return; c.click(); await wait(150); const sh=sheet(); const o=sh?[...sh.querySelectorAll('button')][0]:null; if(o){o.click(); await wait(150);} } }\nasync function advance(){ const c=cta(); if(c && c.style.cursor!=='not-allowed'){ c.click(); await wait(320);} }\n\nfunction snap(label){\n  const phone = $$('div').find(d => /width:\\s*375px/.test(d.getAttribute('style')||''));\n  void phone;\n  if(!phone){ return; }\n  const node = document.importNode(phone, true);\n  node.style.boxShadow='none'; node.style.borderRadius='0'; node.style.border='none';\n  node.style.height='auto'; node.style.minHeight='812px';\n  node.querySelectorAll('.om-scroll').forEach(e=>{ e.style.overflow='visible'; e.style.height='auto'; });\n  node.querySelectorAll('image-slot').forEach(sl=>{ const img=document.createElement('img'); img.src=sl.getAttribute('src')||'coach-avatar.png'; img.setAttribute('style','width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;'); sl.replaceWith(img); });\n  node.querySelectorAll('*').forEach(n=>{ [...n.attributes].forEach(a=>{ if(a.name.startsWith('data-')||a.name==='id'||a.name==='class') n.removeAttribute(a.name); }); });\n  const cell=document.createElement('div'); cell.className='cell';\n  const cap=document.createElement('div'); cap.className='cap'; cap.textContent=label;\n  const fr=document.createElement('div'); fr.className='frame'; fr.appendChild(node);\n  cell.appendChild(cap); cell.appendChild(fr); board.appendChild(cell);\n}\n\nasync function run(){\n  const fr = document.getElementById('src');\n  await new Promise(res => { fr.onload = res; if(fr.contentDocument && fr.contentDocument.readyState==='complete') res(); });\n  await wait(900);\n\n  // PHRASE 1\n  snap('01 · Phrase 1 — vide');\n  let c = $$('button').find(b=>b.textContent.includes('un objectif')); c && c.click(); await wait(300);\n  snap('02 · Sélecteur liste — objectif');\n  sheet() && sheet().querySelector('button').click(); await wait(200);\n  c = $$('button').find(b=>b.textContent.includes('un délai')); c && c.click(); await wait(300);\n  snap('03 · Sélecteur échéance (libre)');\n  sheet() && sheet().querySelector('button').click(); await wait(200);\n  await fillRest(2);\n  snap('04 · Phrase 1 — remplie');\n  await advance();\n\n  // PHRASE 2\n  snap('05 · Phrase 2 — vide');\n  c = $$('button').find(b=>b.textContent.includes('un lieu')); c && c.click(); await wait(300);\n  snap('06 · Sélecteur grille — lieu');\n  sheet() && sheet().querySelector('button').click(); await wait(200);\n  await fillRest(3);\n  snap('07 · Phrase 2 — remplie');\n  await advance();\n\n  // PHRASE 3\n  snap('08 · Phrase 3 — vide');\n  c = $$('button').find(b=>b.textContent.includes('mon frein')); c && c.click(); await wait(250); sheet() && sheet().querySelector('button').click(); await wait(180);\n  c = $$('button').find(b=>b.textContent.includes('mon état')); c && c.click(); await wait(250); sheet() && sheet().querySelector('button').click(); await wait(180);\n  c = $$('button').find(b=>b.textContent.includes('un objet')); c && c.click(); await wait(300);\n  const autre = sheet() && [...sheet().querySelectorAll('button')].find(b=>b.textContent.includes('autre')); autre && autre.click(); await wait(280);\n  snap('09 · Sélecteur objet — saisie « autre »');\n  const inp = sheet() && sheet().querySelector('input'); if(inp){ inp.value='Coros Pace 3'; inp.dispatchEvent(new Event('input',{bubbles:true})); await wait(150); }\n  let ok = sheet() && [...sheet().querySelectorAll('button')].find(b=>b.textContent.trim()==='OK'); ok && ok.click(); await wait(250);\n  snap('10 · Phrase 3 — remplie');\n  await advance();\n\n  // PHRASE 4\n  snap('11 · Phrase 4 — vide');\n  c = $$('button').find(b=>/\\d+\\s*jour/.test(b.textContent)); c && c.click(); await wait(300);\n  const notif = sheet() && [...sheet().querySelectorAll('button')].find(b=>b.textContent.includes('Me rappeler')); notif && notif.click(); await wait(260);\n  snap('12 · Sélecteur jours + rappel');\n  let valider = sheet() && [...sheet().querySelectorAll('button')].find(b=>b.textContent.trim()==='Valider'); valider && valider.click(); await wait(250);\n  await fillRest(3);\n  snap('13 · Phrase 4 — remplie');\n  await advance();\n\n  // RECAP\n  await wait(300);\n  snap('14 · Recap — par défaut');\n  const rnotif = $$('button').find(b=>b.textContent.includes('Me rappeler')); rnotif && rnotif.click(); await wait(250);\n  snap('15 · Recap — rappel activé');\n  const hold = $$('button').find(b=>b.textContent.includes('engager')); if(hold){ hold.click(); await wait(250); }\n  snap('16 · Recap — habitude engagée');\n\n  statusEl.textContent = 'OK · ' + board.children.length + ' frames';\n  statusEl.style.background = '#2E7D32';\n  window.__boardReady = true;\n}\nrun().catch(e => { statusEl.textContent = 'Erreur: ' + e.message; statusEl.style.background='#B00020'; console.error(e); });\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
