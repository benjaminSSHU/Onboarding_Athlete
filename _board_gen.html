<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family:"Trenda"; src:url("fonts/Trenda-Regular.otf") format("opentype"); font-weight:400; }
@font-face { font-family:"Trenda"; src:url("fonts/Trenda-Semibold.otf") format("opentype"); font-weight:600; }
@font-face { font-family:"Trenda"; src:url("fonts/Trenda-Bold.otf") format("opentype"); font-weight:700; }
* { box-sizing:border-box; }
body { margin:0; background:#E9E9E6; font-family:'Sora',sans-serif; padding:48px; }
h1 { font-size:22px; color:#1C1C1C; margin:0 0 4px; }
.sub { font-size:13px; color:#777; margin:0 0 36px; }
#board { display:flex; flex-wrap:wrap; gap:44px; align-items:flex-start; }
.cell { display:flex; flex-direction:column; gap:10px; }
.cap { font-family:'Sora',sans-serif; font-weight:600; font-size:13px; color:#555; letter-spacing:.01em; }
.frame { width:375px; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 8px 30px -12px rgba(0,0,0,.25); }
#status { position:fixed; right:16px; bottom:16px; background:#1C1C1C; color:#fff; font-size:12px; padding:8px 14px; border-radius:20px; font-family:monospace; }
</style>
</head>
<body>
<h1>Onboarding athlète — états du flow</h1>
<p class="sub">Écrans 375×812 · pour import Figma (html.to.design)</p>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#DDF247"/><rect x="34" y="22" width="32" height="56" rx="6" fill="#1C1C1C"/><rect x="38" y="27" width="24" height="46" rx="3" fill="#fff"/></svg></template>
<div id="board"></div>
<div id="status">Génération…</div>
<iframe id="src" src="Onboarding Athlete.dc.html" style="position:fixed; left:-9999px; top:0; width:390px; height:860px; border:0;"></iframe>
<script>
const board = document.getElementById('board');
const statusEl = document.getElementById('status');
const wait = ms => new Promise(r => setTimeout(r, ms));
const doc = () => document.getElementById('src').contentDocument;
const $$ = sel => [...doc().querySelectorAll(sel)];
const sheet = () => $$('div').find(d => (d.style.borderRadius||'').replace(/\s/g,'').startsWith('24px'));
function chipPlus(){ return $$('button').find(b => b.textContent.trim().startsWith('+') && b.style.cursor!=='not-allowed'); }
function cta(){ return $$('button').find(b => ['Continuer','Voir ma routine'].includes(b.textContent.trim())); }
async function fillRest(max){ for(let g=0; g<(max||6); g++){ const c=chipPlus(); if(!c) return; c.click(); await wait(150); const sh=sheet(); const o=sh?[...sh.querySelectorAll('button')][0]:null; if(o){o.click(); await wait(150);} } }
async function advance(){ const c=cta(); if(c && c.style.cursor!=='not-allowed'){ c.click(); await wait(320);} }

function snap(label){
  const phone = $$('div').find(d => /width:\s*375px/.test(d.getAttribute('style')||''));
  void phone;
  if(!phone){ return; }
  const node = document.importNode(phone, true);
  node.style.boxShadow='none'; node.style.borderRadius='0'; node.style.border='none';
  node.style.height='auto'; node.style.minHeight='812px';
  node.querySelectorAll('.om-scroll').forEach(e=>{ e.style.overflow='visible'; e.style.height='auto'; });
  node.querySelectorAll('image-slot').forEach(sl=>{ const img=document.createElement('img'); img.src=sl.getAttribute('src')||'coach-avatar.png'; img.setAttribute('style','width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;'); sl.replaceWith(img); });
  node.querySelectorAll('*').forEach(n=>{ [...n.attributes].forEach(a=>{ if(a.name.startsWith('data-')||a.name==='id'||a.name==='class') n.removeAttribute(a.name); }); });
  const cell=document.createElement('div'); cell.className='cell';
  const cap=document.createElement('div'); cap.className='cap'; cap.textContent=label;
  const fr=document.createElement('div'); fr.className='frame'; fr.appendChild(node);
  cell.appendChild(cap); cell.appendChild(fr); board.appendChild(cell);
}

async function run(){
  const fr = document.getElementById('src');
  await new Promise(res => { fr.onload = res; if(fr.contentDocument && fr.contentDocument.readyState==='complete') res(); });
  await wait(900);

  // PHRASE 1
  snap('01 · Phrase 1 — vide');
  let c = $$('button').find(b=>b.textContent.includes('un objectif')); c && c.click(); await wait(300);
  snap('02 · Sélecteur liste — objectif');
  sheet() && sheet().querySelector('button').click(); await wait(200);
  c = $$('button').find(b=>b.textContent.includes('un délai')); c && c.click(); await wait(300);
  snap('03 · Sélecteur échéance (libre)');
  sheet() && sheet().querySelector('button').click(); await wait(200);
  await fillRest(2);
  snap('04 · Phrase 1 — remplie');
  await advance();

  // PHRASE 2
  snap('05 · Phrase 2 — vide');
  c = $$('button').find(b=>b.textContent.includes('un lieu')); c && c.click(); await wait(300);
  snap('06 · Sélecteur grille — lieu');
  sheet() && sheet().querySelector('button').click(); await wait(200);
  await fillRest(3);
  snap('07 · Phrase 2 — remplie');
  await advance();

  // PHRASE 3
  snap('08 · Phrase 3 — vide');
  c = $$('button').find(b=>b.textContent.includes('mon frein')); c && c.click(); await wait(250); sheet() && sheet().querySelector('button').click(); await wait(180);
  c = $$('button').find(b=>b.textContent.includes('mon état')); c && c.click(); await wait(250); sheet() && sheet().querySelector('button').click(); await wait(180);
  c = $$('button').find(b=>b.textContent.includes('un objet')); c && c.click(); await wait(300);
  const autre = sheet() && [...sheet().querySelectorAll('button')].find(b=>b.textContent.includes('autre')); autre && autre.click(); await wait(280);
  snap('09 · Sélecteur objet — saisie « autre »');
  const inp = sheet() && sheet().querySelector('input'); if(inp){ inp.value='Coros Pace 3'; inp.dispatchEvent(new Event('input',{bubbles:true})); await wait(150); }
  let ok = sheet() && [...sheet().querySelectorAll('button')].find(b=>b.textContent.trim()==='OK'); ok && ok.click(); await wait(250);
  snap('10 · Phrase 3 — remplie');
  await advance();

  // PHRASE 4
  snap('11 · Phrase 4 — vide');
  c = $$('button').find(b=>/\d+\s*jour/.test(b.textContent)); c && c.click(); await wait(300);
  const notif = sheet() && [...sheet().querySelectorAll('button')].find(b=>b.textContent.includes('Me rappeler')); notif && notif.click(); await wait(260);
  snap('12 · Sélecteur jours + rappel');
  let valider = sheet() && [...sheet().querySelectorAll('button')].find(b=>b.textContent.trim()==='Valider'); valider && valider.click(); await wait(250);
  await fillRest(3);
  snap('13 · Phrase 4 — remplie');
  await advance();

  // RECAP
  await wait(300);
  snap('14 · Recap — par défaut');
  const rnotif = $$('button').find(b=>b.textContent.includes('Me rappeler')); rnotif && rnotif.click(); await wait(250);
  snap('15 · Recap — rappel activé');
  const hold = $$('button').find(b=>b.textContent.includes('engager')); if(hold){ hold.click(); await wait(250); }
  snap('16 · Recap — habitude engagée');

  statusEl.textContent = 'OK · ' + board.children.length + ' frames';
  statusEl.style.background = '#2E7D32';
  window.__boardReady = true;
}
run().catch(e => { statusEl.textContent = 'Erreur: ' + e.message; statusEl.style.background='#B00020'; console.error(e); });
</script>
</body>
</html>
